spring.application.name=telemetry-simulator
server.port=8091
spring.session.store-type=none

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*

#Connessione cloudamqp
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true
#Invio eventi
telemetry.rabbitmq.exchange=telemetry.exchange
telemetry.rabbitmq.routing-key=telemetry.event
#Lettura comandi
telemetry.rabbitmq.queue=drone.commands.queue

telemetry.battery.critical-threshold=10